name: Cross-platform Switchboard CLI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/switchboard-core/**"
      - "crates/switchboard-runtime/**"
      - "crates/switchboard-cli/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cross-platform-cli.yml"
  push:
    branches:
      - main
      - staging
    paths:
      - "crates/switchboard-core/**"
      - "crates/switchboard-runtime/**"
      - "crates/switchboard-cli/**"
      - "rust-toolchain.toml"
      - ".github/workflows/cross-platform-cli.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CLI contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/switchboard-core -> target
            crates/switchboard-runtime -> target
            crates/switchboard-cli -> target

      - name: Check formatting
        run: cargo fmt --manifest-path crates/switchboard-core/Cargo.toml --check

      - name: Check runtime formatting
        run: cargo fmt --manifest-path crates/switchboard-runtime/Cargo.toml --check

      - name: Check CLI formatting
        run: cargo fmt --manifest-path crates/switchboard-cli/Cargo.toml --check

      - name: Test shared core
        run: cargo test --manifest-path crates/switchboard-core/Cargo.toml --locked

      - name: Test portable runtime
        run: cargo test --manifest-path crates/switchboard-runtime/Cargo.toml --locked

      - name: Test CLI
        run: cargo test --manifest-path crates/switchboard-cli/Cargo.toml --locked

      - name: Lint shared core
        run: cargo clippy --manifest-path crates/switchboard-core/Cargo.toml --locked --all-targets -- -D warnings

      - name: Lint portable runtime
        run: cargo clippy --manifest-path crates/switchboard-runtime/Cargo.toml --locked --all-targets -- -D warnings

      - name: Lint CLI
        run: cargo clippy --manifest-path crates/switchboard-cli/Cargo.toml --locked --all-targets -- -D warnings

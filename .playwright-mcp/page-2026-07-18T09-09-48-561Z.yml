              - rowgroup [ref=f14e312]:
                - row [ref=f14e313]:
                  - cell [ref=f14e314]:
                    - code [ref=f14e315]: TokenChunker
                  - cell [ref=f14e316]:
                    - code [ref=f14e317]: token
                  - cell "Splits text into fixed-size token chunks." [ref=f14e318]
                - row [ref=f14e319]:
                  - cell [ref=f14e320]:
                    - code [ref=f14e321]: FastChunker
                  - cell [ref=f14e322]:
                    - code [ref=f14e323]: fast
                  - cell "SIMD-accelerated byte-based chunking at 100+ GB/s. Included in the default install." [ref=f14e324]
                - row [ref=f14e325]:
                  - cell [ref=f14e326]:
                    - code [ref=f14e327]: SentenceChunker
                  - cell [ref=f14e328]:
                    - code [ref=f14e329]: sentence
                  - cell "Splits text into chunks based on sentences." [ref=f14e330]
                - row [ref=f14e331]:
                  - cell [ref=f14e332]:
                    - code [ref=f14e333]: RecursiveChunker
                  - cell [ref=f14e334]:
                    - code [ref=f14e335]: recursive
                  - cell "Splits text hierarchically using customizable rules to create semantically meaningful chunks." [ref=f14e336]
                - row [ref=f14e337]:
                  - cell [ref=f14e338]:
                    - code [ref=f14e339]: SemanticChunker
                  - cell [ref=f14e340]:
                    - code [ref=f14e341]: semantic
                  - cell [ref=f14e342]:
                    - text: Splits text into chunks based on semantic similarity. Inspired by the work of
                    - link "Greg Kamradt" [ref=f14e343] [cursor=pointer]:
                      - /url: https://github.com/gkamradt
                    - text: .
                - row [ref=f14e344]:
                  - cell [ref=f14e345]:
                    - code [ref=f14e346]: LateChunker
                  - cell [ref=f14e347]:
                    - code [ref=f14e348]: late
                  - cell "Embeds text and then splits it to have better chunk embeddings." [ref=f14e349]
                - row [ref=f14e350]:
                  - cell [ref=f14e351]:
                    - code [ref=f14e352]: CodeChunker
                  - cell [ref=f14e353]:
                    - code [ref=f14e354]: code
                  - cell "Splits code into structurally meaningful chunks." [ref=f14e355]
                - row [ref=f14e356]:
                  - cell [ref=f14e357]:
                    - code [ref=f14e358]: NeuralChunker
                  - cell [ref=f14e359]:
                    - code [ref=f14e360]: neural
                  - cell "Splits text using a neural model." [ref=f14e361]
                - row [ref=f14e362]:
                  - cell [ref=f14e363]:
                    - code [ref=f14e364]: SlumberChunker
                  - cell [ref=f14e365]:
                    - code [ref=f14e366]: slumber
                  - cell [ref=f14e367]:
                    - text: Splits text using an LLM to find semantically meaningful chunks. Also known as
                    - emphasis [ref=f14e368]: "\"AgenticChunker\""
                    - text: .
                - row [ref=f14e369]:
                  - cell [ref=f14e370]:
                    - code [ref=f14e371]: TableChunker
                  - cell [ref=f14e372]:
                    - code [ref=f14e373]: table
                  - cell "Chunks markdown tables by rows or character count." [ref=f14e374]
                - row [ref=f14e375]:
                  - cell [ref=f14e376]:
                    - code [ref=f14e377]: TeraflopAIChunker
                  - cell [ref=f14e378]:
                    - code [ref=f14e379]: teraflopai
                  - cell "Splits text using the TeraflopAI Segmentation API for domain-specific segmentation." [ref=f14e380]
            - paragraph [ref=f14e381]:
              - text: More on these methods and the approaches taken inside the
              - link "docs" [ref=f14e382] [cursor=pointer]:
                - /url: https://docs.chonkie.ai
            - heading "🔌 Integrations" [level=2] [ref=f14e383]:
              - link:
                - /url: "#user-content--integrations"
              - text: 🔌 Integrations
            - paragraph [ref=f14e384]: Chonkie boasts 45+ integrations across tokenizers, embedding providers, LLMs, refineries, porters, vector databases, and utilities, ensuring it fits seamlessly into your existing workflow.
            - group [ref=f14e385]:
              - strong [ref=f14e387]: 👨‍🍳 Chefs & 📁 Fetchers! Text preprocessing and data loading!
            - group [ref=f14e388]:
              - strong [ref=f14e390]: 🏭 Refine your CHONKs with Context and Embeddings! Chonkie supports 2+ refineries!
            - group [ref=f14e391]:
              - strong [ref=f14e393]: 🐴 Exporting CHONKs! Chonkie supports 2+ Porters!
            - group [ref=f14e394]:
              - strong [ref=f14e396]: 🤝 Shake hands with your DB! Chonkie connects with 10+ vector stores!
            - group [ref=f14e397]:
              - strong [ref=f14e399]: 🪓 Slice 'n' Dice! Chonkie supports 5+ ways to tokenize!
            - group [ref=f14e400]:
              - strong [ref=f14e402]: 🧠 Embed like a boss! Chonkie links up with 16+ embedding pals!
            - group [ref=f14e403]:
              - strong [ref=f14e405]: 🧞‍♂️ Power Up with Genies! Chonkie supports 5+ LLM providers!
            - group [ref=f14e406]:
              - strong [ref=f14e408]: 🛠️ Utilities & Helpers! Chonkie includes handy tools!
            - paragraph [ref=f14e409]: With Chonkie's wide range of integrations, you can easily plug it into your existing infrastructure and start CHONKING!
            - heading "🤖 AI Agent Skills & Plugins" [level=2] [ref=f14e410]:
              - link:
                - /url: "#user-content--ai-agent-skills--plugins"
              - text: 🤖 AI Agent Skills & Plugins
            - paragraph [ref=f14e411]: Chonkie provides an official skill and plugin for AI coding agents, giving them deep knowledge of Chonkie's API, chunking strategies, and pipeline patterns — so they can help you build RAG pipelines faster.
            - paragraph [ref=f14e412]:
              - strong [ref=f14e413]: "Supported agents:"
              - text: Claude Code, Cursor, Gemini CLI, and more.
            - generic [ref=f14e414]: "# Via skills.sh (works with Claude Code, Cursor, Copilot, and 20+ agents) npx skills add chonkie-inc/skills # Claude Code only /plugin marketplace add chonkie-inc/skills"
            - paragraph [ref=f14e415]: Once installed, your agent gains knowledge of all chunkers, the Pipeline API, tokenizer selection, embeddings refineries, vector DB handshakes, the REST API server, recipes, and async/batch processing patterns.
            - paragraph [ref=f14e416]:
              - text: Learn more at
              - link "github.com/chonkie-inc/skills" [ref=f14e417] [cursor=pointer]:
                - /url: https://github.com/chonkie-inc/skills
              - text: .
            - heading "📊 Benchmarks" [level=2] [ref=f14e418]:
              - link:
                - /url: "#user-content--benchmarks"
              - text: 📊 Benchmarks
            - blockquote [ref=f14e419]:
              - paragraph [ref=f14e420]: "\"I may be smol hippo, but I pack a big punch!\" 🦛"
            - paragraph [ref=f14e421]: "Chonkie is not just cute, it's also fast and efficient! Here's how it stacks up against the competition:"
            - paragraph [ref=f14e422]:
              - strong [ref=f14e423]: Size
              - text: 📦
            - list [ref=f14e424]:
              - listitem [ref=f14e425]:
                - strong [ref=f14e426]: "Wheel Size:"
                - text: 505KB (vs 1-12MB for alternatives)
              - listitem [ref=f14e427]:
                - strong [ref=f14e428]: "Installed Size:"
                - text: 49MB (vs 80-171MB for alternatives)
              - listitem [ref=f14e429]:
                - strong [ref=f14e430]: "With Semantic:"
                - text: Still 10x lighter than the closest competition!
            - paragraph [ref=f14e431]:
              - strong [ref=f14e432]: Speed
              - text: ⚡
            - list [ref=f14e433]:
              - listitem [ref=f14e434]:
                - strong [ref=f14e435]: "Token Chunking:"
                - text: 33x faster than the slowest alternative
              - listitem [ref=f14e436]:
                - strong [ref=f14e437]: "Sentence Chunking:"
                - text: Almost 2x faster than competitors
              - listitem [ref=f14e438]:
                - strong [ref=f14e439]: "Semantic Chunking:"
                - text: Up to 2.5x faster than others
            - paragraph [ref=f14e440]:
              - text: Check out our detailed
              - link "benchmarks" [ref=f14e441] [cursor=pointer]:
                - /url: BENCHMARKS.md
              - text: to see how Chonkie races past the competition! 🏃‍♂️💨
            - heading "🤝 Contributing" [level=2] [ref=f14e442]:
              - link:
                - /url: "#user-content--contributing"
              - text: 🤝 Contributing
            - paragraph [ref=f14e443]:
              - text: Want to help grow Chonkie? Check out
              - link "CONTRIBUTING.md" [ref=f14e444] [cursor=pointer]:
                - /url: CONTRIBUTING.md
              - text: to get started! Whether you're fixing bugs, adding features, or improving docs, every contribution helps make Chonkie a better CHONK for everyone.
            - paragraph [ref=f14e445]: "Remember: No contribution is too small for this tiny hippo! 🦛"
            - heading "🙏 Acknowledgements" [level=2] [ref=f14e446]:
              - link:
                - /url: "#user-content--acknowledgements"
              - text: 🙏 Acknowledgements
            - paragraph [ref=f14e447]: Chonkie would like to CHONK its way through a special thanks to all the users and contributors who have helped make this library what it is today! Your feedback, issue reports, and improvements have helped make Chonkie the CHONKIEST it can be.
            - paragraph [ref=f14e448]:
              - text: And of course, special thanks to
              - link "Moto Moto" [ref=f14e449] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=I0zZC4wtqDQ&t=5s
              - text: "for endorsing Chonkie with his famous quote:"
            - blockquote [ref=f14e450]:
              - paragraph [ref=f14e451]: "\"I like them big, I like them chonkie.\" ~ Moto Moto"
            - heading "📝 Citation" [level=2] [ref=f14e452]:
              - link:
                - /url: "#user-content--citation"
              - text: 📝 Citation
            - paragraph [ref=f14e453]: "If you use Chonkie in your research, please cite it as follows:"
            - generic [ref=f14e454]: "@software{chonkie2025, author = {Minhas, Bhavnick AND Nigam, Shreyash}, title = {Chonkie: The lightweight ingestion library for fast, efficient and robust RAG pipelines}, year = {2025}, publisher = {GitHub}, howpublished = {\\url{https://github.com/chonkie-inc/chonkie}}, }"
        - text:      

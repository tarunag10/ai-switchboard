            - heading "🚀 Usage" [level=2] [ref=f14e283]:
              - link:
                - /url: "#user-content--usage"
              - text: 🚀 Usage
            - heading "Basic Usage" [level=3] [ref=f14e284]:
              - link:
                - /url: "#user-content-basic-usage"
              - text: Basic Usage
            - paragraph [ref=f14e285]: "Here's a basic example to get you started:"
            - generic [ref=f14e286]: "# First import the chunker you want from Chonkie from chonkie import RecursiveChunker # Initialize the chunker chunker = RecursiveChunker() # Chunk some text chunks = chunker(\"Chonkie is the goodest boi! My favorite chunking hippo hehe.\") # Access chunks for chunk in chunks: print(f\"Chunk: {chunk.text}\") print(f\"Tokens: {chunk.token_count}\")"
            - heading "Pipeline Usage" [level=3] [ref=f14e287]:
              - link:
                - /url: "#user-content-pipeline-usage"
              - text: Pipeline Usage
            - paragraph [ref=f14e288]:
              - text: You can also use the
              - code [ref=f14e289]: chonkie.Pipeline
              - text: to chain components together and handle complex workflows. Read more about pipelines in the
              - link "docs" [ref=f14e290] [cursor=pointer]:
                - /url: https://docs.chonkie.ai/oss/pipelines
              - text: "!"
            - generic [ref=f14e291]: "from chonkie import Pipeline # Create a pipeline with multiple chunking and refinement steps pipe = ( Pipeline() .chunk_with(\"recursive\", tokenizer=\"gpt2\", chunk_size=2048, recipe=\"markdown\") .chunk_with(\"semantic\", chunk_size=512) .refine_with(\"overlap\", context_size=128) .refine_with(\"embeddings\", embedding_model=\"sentence-transformers/all-MiniLM-L6-v2\") ) # CHONK some Texts! doc = pipe.run(texts=\"Chonkie is the goodest boi! My favorite chunking hippo hehe.\") # Access the processed chunks in the `doc` object for chunk in doc.chunks: print(chunk.text) # Run asynchronously for high-throughput applications import asyncio async def main(): doc = await pipe.arun(texts=\"Chonkie runs fast!\") print(len(doc.chunks)) asyncio.run(main())"
            - paragraph [ref=f14e292]:
              - text: Check out more usage examples in the
              - link "docs" [ref=f14e293] [cursor=pointer]:
                - /url: https://docs.chonkie.ai
              - text: "!"
            - heading "🌐 API Server" [level=2] [ref=f14e294]:
              - link:
                - /url: "#user-content--api-server"
              - text: 🌐 API Server
            - paragraph [ref=f14e295]: "Run Chonkie as a self-hosted REST API for easy integration into any application:"
            - generic [ref=f14e296]: "# Install with API dependencies (includes catsu for multi-provider embeddings) pip install \"chonkie[api,semantic,code,catsu]\" # Start the server using the CLI chonkie serve # Or with custom options chonkie serve --port 3000 --reload --log-level debug # Or directly with uvicorn uvicorn chonkie.api.main:app --host 0.0.0.0 --port 8000"
            - paragraph [ref=f14e297]: "Or use Docker:"
            - generic [ref=f14e298]: docker compose up
            - paragraph [ref=f14e299]:
              - text: The API provides endpoints for all chunkers, refineries, and
              - strong [ref=f14e300]: pipelines
              - text: — reusable workflow configurations stored in a local SQLite database.
            - generic [ref=f14e301]: "# Create a reusable pipeline curl -X POST http://localhost:8000/v1/pipelines \\ -H \"Content-Type: application/json\" \\ -d '{ \"name\": \"rag-chunker\", \"steps\": [ {\"type\": \"chunk\", \"chunker\": \"semantic\", \"config\": {\"chunk_size\": 512}}, {\"type\": \"refine\", \"refinery\": \"embeddings\", \"config\": {\"embedding_model\": \"text-embedding-3-small\"}} ] }' # List your pipelines curl http://localhost:8000/v1/pipelines"
            - paragraph [ref=f14e302]:
              - text: Interactive documentation is available at
              - code [ref=f14e303]: /docs
              - text: when the server is running.
            - heading "✂️ Chunkers" [level=2] [ref=f14e304]:
              - link:
                - /url: "#user-content-️-chunkers"
              - text: ✂️ Chunkers
            - paragraph [ref=f14e305]: "Chonkie provides several chunkers to help you split your text efficiently for RAG applications. Here's a quick overview of the available chunkers:"

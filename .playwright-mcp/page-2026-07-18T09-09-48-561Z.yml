                - /url: "#user-content-full-installation"
              - text: Full Installation
            - paragraph [ref=f14e275]:
              - text: Chonkie follows the rule of minimum installs. Have a favorite chunker? Read our
              - link "docs" [ref=f14e276] [cursor=pointer]:
                - /url: https://docs.chonkie.ai
              - text: to install only what you need. Don't want to think about it? Simply install

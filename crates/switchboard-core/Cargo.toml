[package]
name = "switchboard-core"
version = "0.1.0"
description = "Provider-neutral AI Switchboard contracts shared by desktop and CLI surfaces."
license = "MIT"
edition = "2021"
rust-version = "1.96"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.22.0", features = ["v4"] }
